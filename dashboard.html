<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="dashboard.html"><i class="bi bi-hospital"></i> Hospital Management</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">Bienvenido, <strong id="userName">Usuario</strong></span>
                <button class="btn btn-light btn-sm" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 sidebar p-0">
                <div class="list-group rounded-0">
                    <div class="list-group-item active fw-bold">MENÚ</div>
                    <a href="pages/admin/usuarios.html" class="list-group-item list-group-item-action admin-option"><i class="bi bi-people-fill"></i> Gestión Usuarios</a>
                    <a href="pages/admin/roles.html" class="list-group-item list-group-item-action admin-option"><i class="bi bi-person-badge"></i> Asignar Roles</a>
                    <a href="pages/admin/citas.html" class="list-group-item list-group-item-action admin-option"><i class="bi bi-calendar-check"></i> Todas las Citas</a>
                    <a href="pages/doctor/disponibilidad.html" class="list-group-item list-group-item-action doctor-option"><i class="bi bi-clock-history"></i> Disponibilidad</a>
                    <a href="pages/doctor/citas.html" class="list-group-item list-group-item-action doctor-option"><i class="bi bi-journal-medical"></i> Mis Citas</a>
                    <a href="pages/paciente/solicitar-cita.html" class="list-group-item list-group-item-action patient-option"><i class="bi bi-calendar-plus"></i> Solicitar Cita</a>
                    <a href="pages/paciente/mis-citas.html" class="list-group-item list-group-item-action patient-option"><i class="bi bi-card-list"></i> Historial</a>
                </div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <h2 class="mb-4">Dashboard</h2>

                <div class="row g-4">
                    <div class="col-md-3">
                        <div class="card dashboard-card bg-primary text-white">
                            <div class="card-body">
                                <h5>Total Usuarios</h5>
                                <h2 id="totalUsers">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card dashboard-card bg-success text-white">
                            <div class="card-body">
                                <h5>Doctores</h5>
                                <h2 id="totalDoctors">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card dashboard-card bg-warning text-dark">
                            <div class="card-body">
                                <h5>Pacientes</h5>
                                <h2 id="totalPatients">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card dashboard-card bg-danger text-white">
                            <div class="card-body">
                                <h5>Citas</h5>
                                <h2 id="totalAppointments">0</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow mt-5">
                    <div class="card-header bg-light">
                        <h5 class="mb-0">Últimas Citas</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead class="table-primary">
                                    <tr>
                                        <th>Paciente</th>
                                        <th>Doctor</th>
                                        <th>Fecha</th>
                                        <th>Hora</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="appointmentsTable">
                                    <tr><td colspan="5" class="text-center">No hay citas registradas.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/guards.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/users.js"></script>
    <script src="js/availability.js"></script>
    <script src="js/appointments.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
