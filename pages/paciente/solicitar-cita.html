<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="../../dashboard.html"><i class="bi bi-hospital"></i> Hospital Management</a>
            <div class="d-flex align-items-center">
                <a href="../../dashboard.html" class="btn btn-light btn-sm me-2">Volver</a>
                <button class="btn btn-light btn-sm" id="logoutBtn">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="card shadow mb-4">
            <div class="card-header bg-light">
                <h4 class="mb-0">Solicitar Cita Médica</h4>
            </div>
            <div class="card-body">
                <form id="appointmentForm" novalidate>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="doctorId" class="form-label">Doctor</label>
                            <select class="form-select" id="doctorId" required></select>
                        </div>
                        <div class="col-md-4">
                            <label for="appointmentDate" class="form-label">Fecha</label>
                            <input type="date" class="form-control" id="appointmentDate" required>
                        </div>
                        <div class="col-md-4">
                            <label for="appointmentTime" class="form-label">Hora</label>
                            <input type="time" class="form-control" id="appointmentTime" required>
                        </div>
                        <div class="col-md-4">
                            <label for="specialty" class="form-label">Especialidad</label>
                            <input type="text" class="form-control" id="specialty" required>
                        </div>
                        <div class="col-12">
                            <button class="btn btn-primary" type="submit">Enviar solicitud</button>
                        </div>
                    </div>
                </form>
                <div id="message" class="mt-3"></div>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header bg-light">
                <h5 class="mb-0">Disponibilidad disponible</h5>
            </div>
            <div class="card-body" id="slotsContainer"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/guards.js"></script>
    <script src="../../js/ui.js"></script>
    <script src="../../js/availability.js"></script>
    <script src="../../js/appointments.js"></script>
    <script src="../../js/app.js"></script>
</body>
</html>
